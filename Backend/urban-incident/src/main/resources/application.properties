spring.application.name=urban-incident
server.port=8082

# ---- Base de données H2 (en mémoire) ----
spring.datasource.url=jdbc:h2:mem:urban_incident_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Console H2 ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Enregistrement auprès d'Eureka Server ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics

# ---- Notification Service Configuration ----
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
notification.service.enabled=${NOTIFICATION_SERVICE_ENABLED:true}
