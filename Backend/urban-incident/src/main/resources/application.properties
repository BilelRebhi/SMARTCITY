spring.application.name=urban-incident
server.port=8085

# ---- Database Configuration ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urban_incident_db}
spring.datasource.username=${DB_USERNAME:urban_user}
spring.datasource.password=${DB_PASSWORD:urban_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics

# ---- Notification Service Configuration ----
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
notification.service.enabled=${NOTIFICATION_SERVICE_ENABLED:true}
