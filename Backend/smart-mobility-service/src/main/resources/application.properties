spring.application.name=smart-mobility-service
server.port=8085

# In-memory H2 so the service starts without extra database setup.
# Switch to PostgreSQL later (database-per-service: smart_mobility_db).
spring.datasource.url=jdbc:h2:mem:smart_mobility_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
