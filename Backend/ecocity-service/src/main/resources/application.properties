spring.application.name=ecocity-service
server.port=${SERVER_PORT:8084}

# Database (ecocity_db, owned only by MS4)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecocity_db}
spring.datasource.username=${DB_USERNAME:ecocity_user}
spring.datasource.password=${DB_PASSWORD:ecocity_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Eureka registration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
